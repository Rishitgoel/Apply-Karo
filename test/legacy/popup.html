<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Apply karo Popup</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      min-width: 320px;
      max-width: 350px;
      padding: 16px;
      background: #080c16;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: auto;
    }
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 12px;
    }
    .popup-title {
      font-size: 16px;
      font-weight: 700;
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: 'Outfit', sans-serif;
    }
    .popup-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--grad-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 850;
      font-size: 16px;
      color: #fff;
    }
    .status-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .status-label {
      color: var(--text-secondary);
    }
    .status-value {
      font-weight: 500;
    }
    .file-name {
      font-size: 12px;
      color: var(--text-muted);
      word-break: break-all;
      text-align: right;
      margin-top: 2px;
    }
    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    .btn-full {
      width: 100%;
    }
    .footer-text {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="popup-logo">R</div>
      <div class="popup-title">Apply karo</div>
    </div>
    <span id="version" style="font-size: 10px; color: var(--text-muted);">v1.0.0</span>
  </div>

  <div class="glass-panel status-section" style="padding: 12px;">
    <div class="status-row">
      <span class="status-label">Auto-fill on load</span>
      <label class="switch">
        <input type="checkbox" id="autofill-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="status-row" style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; flex-direction: column; align-items: stretch; gap: 4px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="status-label">Resume Uploaded</span>
        <span id="resume-badge" class="badge badge-danger">Missing</span>
      </div>
      <div id="resume-filename" class="file-name" style="display: none;">resume.pdf</div>
    </div>

    <div class="status-row" style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
      <span class="status-label">Gemini AI Engine</span>
      <span id="ai-badge" class="badge badge-warning">Not Configured</span>
    </div>
  </div>

  <div class="actions-grid">
    <button id="fill-btn" class="btn btn-primary btn-full">
      <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24">
        <path d="M12,2A10,10,0,0,0,2,12a9.89,9.89,0,0,0,2.26,6.33l-2,2a1,1,0,0,0-.21,1.09A1,1,0,0,0,3,22H7a1,1,0,0,0,1-1V17a1,1,0,0,0-.58-.91,1,1,0,0,0-1.09.21l-1.3,1.3A8,8,0,1,1,12,20a7.93,7.93,0,0,1-4.73-1.56,1,1,0,0,0-1.37.18,1,1,0,0,0,.18,1.37A9.94,9.94,0,0,0,12,22,10,10,0,0,0,12,2Z"/>
      </svg>
      Fill Form on Page
    </button>
    <button id="dashboard-btn" class="btn btn-full">
      <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24">
        <path d="M19,3H5C3.89,3 3,3.89 3,5V19C3,20.11 3.89,21 5,21H19C20.11,21 21,20.11 21,19V5C21,3.89 20.11,3 19,3M19,19H5V5H19V19M17,17H12V15H17V17M17,13H12V11H17V13M17,9H12V7H17V9M10,17H7V15H10V17M10,13H7V11H10V13M10,9H7V7H10V9Z"/>
      </svg>
      Open Dashboard
    </button>
  </div>

  <div class="footer-text">
    Secure Local Data Storage
  </div>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
